# Robot YouTube : relève les vues et les abonnés toutes les 10 minutes (dans le cloud de GitHub).
# Nécessite le secret YT_API_KEY (Settings > Secrets and variables > Actions).
# TikTok bloque les serveurs de GitHub : TikTok est relevé par le robot installé sur ton PC (tiktok.yml).
name: Stats en direct

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: stats-youtube
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Relever les chiffres YouTube
        run: node scripts/update-stats.mjs youtube
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
      - name: Enregistrer s'il y a du nouveau
        run: node scripts/save-stats.mjs youtube
        env:
          GITHUB_TOKEN: ${{ github.token }}
