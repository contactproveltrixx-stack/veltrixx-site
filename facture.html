<!DOCTYPE html>
<html lang="fr" data-v="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Document</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#0A0A0A;color:#EDEDED;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:28px 18px 40px}
.brand{display:flex;align-items:center;gap:10px;color:#A3A3A3;font-size:13px}.brand svg{width:16px;height:18px;color:#EDEDED}
.wrap{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px;margin-top:18px;align-items:start}
.card{background:#141414;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:20px}
h1{font-size:15px;font-weight:500;color:#A3A3A3;margin:0}.num{font:500 13px ui-monospace,Consolas,monospace;color:#8A8A8A;margin-top:2px}
.amt{font-size:38px;font-weight:600;letter-spacing:-.02em;margin:14px 0 2px;font-variant-numeric:tabular-nums}.due{color:#A3A3A3;font-size:13.5px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:44px;border-radius:11px;border:0;font:inherit;font-weight:500;cursor:pointer;text-decoration:none;margin-top:10px}
.pri{background:#2F7BFF;color:#fff}.sec{background:#1F1F1F;color:#EDEDED;border:1px solid rgba(255,255,255,.1)}
.lab{font-size:12px;color:#8A8A8A;margin:20px 0 4px;text-transform:none}
.iban{font:500 13.5px ui-monospace,Consolas,monospace;overflow-wrap:anywhere;background:#0F0F0F;border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:10px 12px;margin-top:6px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.iban button{background:none;border:0;color:#2F7BFF;font:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap}
.from{margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.08);font-size:13px;color:#A3A3A3}.from b{color:#EDEDED;font-weight:500}.from a{color:#A3A3A3}
.paper{background:#fff;border-radius:12px;overflow:hidden;position:relative;aspect-ratio:210/297}
.paper iframe{position:absolute;top:0;left:0;width:794px;height:1123px;border:0;transform-origin:0 0}
.muted{color:#8A8A8A;font-size:12.5px;margin-top:16px}.err{color:#E5484D}
@media (max-width:760px){.wrap{grid-template-columns:1fr}.amt{font-size:32px}}
</style>
</head>
<body>
<main>
  <div class="brand"><svg viewBox="281 262 462 500" aria-hidden="true"><path d="M281 262H411L512 557L613 262H743L572 762H452Z" fill="currentColor"/></svg><span id="who">Document privé</span></div>
  <div id="app"><p class="muted">Ouverture du document…</p></div>
</main>
<script>
(async function () {
  var RAW = 'https://raw.githubusercontent.com/contactproveltrixx-stack/veltrixx-site/main/', app = document.getElementById('app');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fail(m) { app.innerHTML = '<div class="card" style="margin-top:18px"><p class="err" style="margin:0">' + esc(m) + '</p><p class="muted">Vérifie que le lien est complet (il est long, c’est normal), ou demande-le à nouveau à l’expéditeur.</p></div>'; }
  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function b64u(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return b64(s); }
  var h = location.hash.slice(1).split('.'), id = h[0], key = h[1];
  if (!/^[\w-]{8,}$/.test(id || '') || !key) return fail('Lien incomplet.');
  var blob = null;
  try {
    var r = await fetch('fac/' + id + '.json', { cache: 'no-store' });
    if (!r.ok) r = await fetch(RAW + 'fac/' + id + '.json', { cache: 'no-store' });
    if (!r.ok) return fail(r.status === 404 ? 'Ce document n’existe pas ou plus.' : 'Document momentanément indisponible, réessaie dans une minute.');
    blob = await r.json();
  } catch (e) { return fail('Impossible de charger le document. Vérifie ta connexion.'); }
  var d;
  try {
    var k = await crypto.subtle.importKey('raw', b64u(key), 'AES-GCM', false, ['decrypt']);
    var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(blob.iv) }, k, b64(blob.ct));
    d = JSON.parse(new TextDecoder().decode(plain));
  } catch (e) { return fail('Lien invalide : le document ne peut pas être ouvert.'); }
  var isQ = d.kind === 'devis', eur = function (n) { return new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR' }).format(n || 0); };
  var fd = function (s) { if (!s) return ''; var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }); };
  document.title = (isQ ? 'Devis ' : 'Facture ') + d.number + (d.from.name ? ' · ' + d.from.name : '');
  document.getElementById('who').textContent = d.from.name || 'Document privé';
  var pay = d.pay || {}, h2 = '';
  if (pay.paypal) h2 += '<a class="btn pri" href="' + esc(pay.paypal) + '" target="_blank" rel="noopener">Payer avec PayPal</a>';
  if (pay.revolut) h2 += '<a class="btn ' + (pay.paypal ? 'sec' : 'pri') + '" href="' + esc(pay.revolut) + '" target="_blank" rel="noopener">Payer avec Revolut</a>';
  if (pay.iban) h2 += '<div class="lab">Virement bancaire' + (pay.holder ? ' · ' + esc(pay.holder) : '') + '</div><div class="iban"><span>' + esc(pay.iban) + (pay.bic ? '<br><small style="color:#8A8A8A">BIC ' + esc(pay.bic) + '</small>' : '') + '</span><button type="button" id="cp">Copier</button></div>';
  app.innerHTML = '<div class="wrap"><div class="card"><h1>' + (isQ ? 'Devis' : 'Facture') + (d.client ? ' pour ' + esc(d.client) : '') + '</h1><div class="num">' + esc(d.number) + '</div>' +
    '<div class="amt">' + eur(d.total) + '</div><div class="due">' + (isQ ? 'Émis le ' + fd(d.date) : d.due ? 'À régler avant le ' + fd(d.due) : 'Émise le ' + fd(d.date)) + '</div>' +
    (d.pdf ? '<a class="btn ' + (h2 ? 'sec' : 'pri') + '" id="dl" href="#">Télécharger le PDF</a>' : '<button class="btn sec" id="pr" type="button">Imprimer ou enregistrer en PDF</button>') + h2 +
    '<div class="from"><b>' + esc(d.from.name) + '</b>' + (d.from.person && d.from.person !== d.from.name ? ' · ' + esc(d.from.person) : '') + (d.from.email ? '<br><a href="mailto:' + esc(d.from.email) + '">' + esc(d.from.email) + '</a>' : '') + (d.from.tel ? ' · ' + esc(d.from.tel) : '') + '</div>' +
    '<p class="muted">Lien privé : ne le partage pas. Le document est chiffré, seul ce lien permet de l’ouvrir.</p></div>' +
    '<div class="paper" id="paper"><iframe id="doc" title="Document" sandbox="allow-same-origin"></iframe></div></div>';
  var fr = document.getElementById('doc'), paper = document.getElementById('paper');
  fr.srcdoc = d.html;
  var fit = function () { fr.style.transform = 'scale(' + paper.clientWidth / 794 + ')'; };
  fit(); window.addEventListener('resize', fit);
  var dl = document.getElementById('dl');
  if (dl) { var url = URL.createObjectURL(new Blob([b64(d.pdf)], { type: 'application/pdf' })); dl.href = url; dl.download = d.file || (d.number + '.pdf'); }
  var pr = document.getElementById('pr');
  if (pr) pr.onclick = function () { var w = window.open('', '_blank'); if (!w) return; w.document.write(d.html); w.document.close(); setTimeout(function () { w.focus(); w.print(); }, 300); };
  var cp = document.getElementById('cp');
  if (cp) cp.onclick = function () { navigator.clipboard.writeText(pay.iban.replace(/\s/g, '')).then(function () { cp.textContent = 'Copié'; }); };
})();
</script>
</body>
</html>
