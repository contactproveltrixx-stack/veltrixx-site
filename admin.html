<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin — Veltrixx</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#03050C">
<link rel="icon" href="https://unavatar.io/x/veltrixx10?fallback=https%3A%2F%2Fpbs.twimg.com%2Fprofile_images%2F2116868082761101312%2FRHSWf1au_normal.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,800;0,900;1,800;1,900&family=Manrope:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="admin">
<main>
  <section class="page-hero">
    <div class="wrap">
      <h1 class="h">Panneau <span class="g">admin</span></h1>
      <p class="lead">Gère les avis laissés sur ton site : masquer, réafficher ou supprimer.</p>
    </div>
  </section>
  <section style="padding-top:0">
    <div class="wrap" id="admin">
      <!-- Connexion -->
      <form class="panel adm-login" id="admLogin" novalidate>
        <div class="field"><label for="adm-pass">Mot de passe admin</label><input id="adm-pass" type="password" autocomplete="current-password" required></div>
        <button class="btn btn-gold" type="submit">Se connecter</button>
        <p class="msg" id="admLoginMsg" role="status" hidden></p>
      </form>
      <!-- Tableau de bord -->
      <div id="admBoard" hidden>
        <div class="adm-bar">
          <div class="adm-kpis" id="admKpis"></div>
          <div class="adm-tools">
            <div class="toggle" role="group" aria-label="Filtre" id="admFilter">
              <button type="button" data-f="all" aria-pressed="true">Tous</button>
              <button type="button" data-f="on" aria-pressed="false">En ligne</button>
              <button type="button" data-f="off" aria-pressed="false">Masqués</button>
            </div>
            <button class="btn btn-ghost btn-sm" type="button" id="admRefresh">Actualiser</button>
            <a class="btn btn-ghost btn-sm" id="admSheet" target="_blank" rel="noopener" hidden>Feuille Google ↗</a>
            <button class="btn btn-ghost btn-sm" type="button" id="admLogout">Déconnexion</button>
          </div>
        </div>
        <p class="msg" id="admMsg" role="status" hidden></p>
        <div class="adm-list" id="admList"></div>
      </div>
    </div>
  </section>
</main>
<script src="assets/data.js"></script>
<script src="assets/site.js"></script>
<script src="assets/admin.js"></script>
</body>
</html>
